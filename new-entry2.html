<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>New Entry - Step 2 | CPRI Aeroponics</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <div style="text-align: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px solid var(--primary-color);">
            <div style="font-size: 36px; margin-bottom: 8px;">🥔</div>
            <h2 style="margin: 0; font-size: 18px;">CPRI</h2>
            <p style="color: var(--text-muted); font-size: 11px; margin: 5px 0 0 0;">Aeroponics Management</p>
        </div>
        <a href="dashboard.html"><span>📊</span> Dashboard</a>
        <a href="new-entry1.html" class="active"><span>📝</span> New Entry</a>
        <a href="view-data.html"><span>📊</span> View Data</a>
        <a href="analytics.html"><span>📈</span> Analytics</a>
        <a href="manage-users.html"><span>👥</span> Users</a>
        <a href="manage-unit.html"><span>🏭</span> Units</a>
        <a href="index.html" style="margin-top: 30px; background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);"><span>🚪</span> Logout</a>
    </div>

    <div class="main">
        <h1>📝 New Entry - Step 2/3</h1>
        <p style="color: #94A3B8; margin-bottom: 20px;">Filter Status</p>

        <div class="form-container">
            <form id="entryForm2">
                <label for="mainFilter">Main Filter Status</label>
                <select id="mainFilter" required>
                    <option value="">Select Status</option>
                    <option value="Yes">✅ Yes - Clean</option>
                    <option value="No">❌ No - Needs Replacement</option>
                </select>

                <label for="nozzleFilter">Nozzle Filter Status</label>
                <select id="nozzleFilter" required>
                    <option value="">Select Status</option>
                    <option value="Yes">✅ Yes - Clean</option>
                    <option value="No">❌ No - Needs Replacement</option>
                </select>

                <div id="formError" class="alert"></div>

                <button type="button" onclick="location.href='new-entry1.html'">← Back</button>
                <button type="submit">Save & Next →</button>
                <button type="button" class="secondary" onclick="location.href='dashboard.html'">Cancel</button>
            </form>
        </div>
    </div>

    <script src="css/js/auth.js"></script>
    <script src="css/js/data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Guard 1: Active Session Check
            const currentUser = getCurrentUser();
            if (!currentUser) {
                window.location.href = 'index.html';
                return;
            }

            // Guard 2: Step 1 Completion Check
            const step1Data = sessionStorage.getItem('step1Data');
            if (!step1Data) {
                alert('Please complete Step 1 first.');
                window.location.href = 'new-entry1.html';
                return;
            }

            // Load existing data if returning from next step
            const savedData = sessionStorage.getItem('step2Data');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('mainFilter').value = data.mainFilter || '';
                document.getElementById('nozzleFilter').value = data.nozzleFilter || '';
            }
        });

        document.getElementById('entryForm2').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                mainFilter: document.getElementById('mainFilter').value,
                nozzleFilter: document.getElementById('nozzleFilter').value
            };
            
            sessionStorage.setItem('step2Data', JSON.stringify(formData));
            window.location.href = 'new-entry3.html';
        });
    </script>
</body>
</html>
