<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>New Entry - Step 1 | CPRI Aeroponics</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <div style="text-align: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px solid var(--primary-color);">
            <div style="font-size: 36px; margin-bottom: 8px;">🥔</div>
            <h2 style="margin: 0; font-size: 18px;">CPRI</h2>
            <p style="color: var(--text-muted); font-size: 11px; margin: 5px 0 0 0;">Aeroponics Management</p>
        </div>
        <a href="dashboard.html"><span>📊</span> Dashboard</a>
        <a href="new-entry1.html" class="active"><span>📝</span> New Entry</a>
        <a href="view-data.html"><span>📊</span> View Data</a>
        <a href="analytics.html"><span>📈</span> Analytics</a>
        <a href="manage-users.html"><span>👥</span> Users</a>
        <a href="manage-unit.html"><span>🏭</span> Units</a>
        <a href="index.html" style="margin-top: 30px; background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);"><span>🚪</span> Logout</a>
    </div>

    <div class="main">
        <h1>📝 New Entry - Step 1/3</h1>

        <div class="form-container">
            <h2>Water Quality Parameters</h2>
            <form id="step1Form">
                <label for="unit">Unit</label>
                <select id="unit" required>
                    <option value="">Select Unit</option>
                    <option value="AB Tuber">AB Tuber</option>
                    <option value="Star Biotech">Star Biotech</option>
                    <option value="Nanak Biotech">Nanak Biotech</option>
                </select>

                <label for="role">Role</label>
                <select id="role" required>
                    <option value="">Select Role</option>
                    <option value="Super Admin">Super Admin</option>
                    <option value="Unit Admin">Unit Admin</option>
                    <option value="User">User</option>
                </select>

                <label for="ecPrev">EC Previous (mS/cm)</label>
                <input type="number" id="ecPrev" step="0.01" min="0" max="5" placeholder="e.g., 1.5" required>

                <label for="ecSet">EC Set (mS/cm)</label>
                <input type="number" id="ecSet" step="0.01" min="0" max="5" placeholder="e.g., 2.0" required>

                <label for="phPrev">pH Previous</label>
                <input type="number" id="phPrev" step="0.1" min="0" max="14" placeholder="e.g., 6.0" required>

                <label for="phSet">pH Set</label>
                <input type="number" id="phSet" step="0.1" min="0" max="14" placeholder="e.g., 6.5" required>

                <label for="photo">Upload Photo</label>
                <input type="file" id="photo" accept="image/*" onchange="previewPhoto(this)">
                <div id="photoPreview" style="margin-top: 10px; display: none;">
                    <img id="previewImage" style="max-width: 200px; max-height: 200px; border-radius: 10px;">
                </div>

                <button type="submit">Next →</button>
                <button type="button" class="secondary" onclick="window.location.href='dashboard.html'">Cancel</button>
            </form>
        </div>
    </div>

    <script src="css/js/auth.js"></script>
    <script src="css/js/data.js"></script>
    <script>
        function previewPhoto(input) {
            const preview = document.getElementById('photoPreview');
            const image = document.getElementById('previewImage');
            
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    image.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            } else {
                preview.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('step1Form');
            const currentUser = getCurrentUser();
            
            if (currentUser) {
                document.getElementById('unit').value = currentUser.unit;
                document.getElementById('role').value = currentUser.role;
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const photoInput = document.getElementById('photo');
                let photoData = null;
                
                if (photoInput.files && photoInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        photoData = e.target.result;
                        saveStep1Data(photoData);
                    };
                    reader.readAsDataURL(photoInput.files[0]);
                } else {
                    saveStep1Data(null);
                }
            });

            function saveStep1Data(photoData) {
                const step1Data = {
                    unit: document.getElementById('unit').value,
                    role: document.getElementById('role').value,
                    ecPrev: document.getElementById('ecPrev').value,
                    ecSet: document.getElementById('ecSet').value,
                    phPrev: document.getElementById('phPrev').value,
                    phSet: document.getElementById('phSet').value,
                    photo: photoData
                };

                sessionStorage.setItem('step1Data', JSON.stringify(step1Data));
                window.location.href = 'new-entry2.html';
            }

            // Load existing data if returning from next step
            const savedData = sessionStorage.getItem('step1Data');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('unit').value = data.unit;
                document.getElementById('role').value = data.role;
                document.getElementById('ecPrev').value = data.ecPrev;
                document.getElementById('ecSet').value = data.ecSet;
                document.getElementById('phPrev').value = data.phPrev;
                document.getElementById('phSet').value = data.phSet;
                
                if (data.photo) {
                    const preview = document.getElementById('photoPreview');
                    const image = document.getElementById('previewImage');
                    image.src = data.photo;
                    preview.style.display = 'block';
                }
            }
        });
    </script>
</body>
</html>
